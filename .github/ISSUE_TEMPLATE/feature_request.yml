name: Feature request / 기능 제안
description: Describe the problem and desired behavior.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 해결하려는 문제
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Desired behavior / 원하는 동작
    validations:
      required: true
